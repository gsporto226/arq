name: arq_workspace
publish_to: none

environment:
  sdk: ">=3.13.0"

workspace:
  - packages/*
  - apps/*

dev_dependencies:
  melos: ^7.0.0

dependency_overrides:
  reef:
    path: ../reef/packages/reef
  reef_router:
    path: ../reef/packages/reef_router
  reef_utils:
    path: ../reef/packages/reef_utils
  formularium:
    path: ../formularium/packages/formularium
  formularium_localization:
    path: ../formularium/packages/formularium_localization
  task_graph:
    path: ../task_graph
  reef_fp:
    path: ../reef/packages/reef_fp
  listenable_plus:
    path: ../listenable_plus

melos:
  repository: https://github.com/gsporto226/arq
